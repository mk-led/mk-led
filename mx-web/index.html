<!doctype html>
<html lang="en-IN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8SDSJ587SN"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())
      gtag('config', 'G-8SDSJ587SN')
      gtag('config', 'GT-NGKRSQZ8')
    </script>
    <meta name="theme-color" content="#08090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Apply the saved or system colour scheme before first paint. Keys must match src/theme/theme.ts. -->
    <script>
      ;(function () {
        var mode = null
        try {
          mode = localStorage.getItem('mk-mode')
        } catch (e) {}
        if (mode !== 'light' && mode !== 'dark') {
          mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.setAttribute('data-theme', mode)
      })()
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
